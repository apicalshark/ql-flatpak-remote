name: Flatpak

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  # App ID (reverse-DNS) (example= org.tenacityaudio.Tenacity)
  APP_ID: io.github.Mrmayman.QuantumLauncher
  # Path to manifest (example= org.tenacityaudio.Tenacity.yaml)
  MANIFEST_PATH: io.github.Mrmayman.QuantumLauncher.yml
  # Flatpak branch (example= stable, beta, nightly)
  FLATPAK_BRANCH: stable

  FLATPAK_BUILD_DIR: build-dir
  FLATPAK_BUILD_REPO: build-repo

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            alt: x86_64 
            runner: ubuntu-24.04
          - arch: arm64
            alt: aarch64
            runner: ubuntu-24.04-arm

    steps:        
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install flatpak-builder
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install flatpak-builder

    - name: Download flatpak SDK and sources
      run: |
        set -e
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak-builder --default-branch=${FLATPAK_BRANCH} --arch=${{ matrix.alt }} --install-deps-from=flathub --install-deps-only --user /dev/null ${MANIFEST_PATH}
        flatpak-builder --default-branch=${FLATPAK_BRANCH} --arch=${{ matrix.alt }} --download-only /dev/null ${MANIFEST_PATH}

    # In Ubuntu, Git no longer allows you to add a submodule via file:///
    # transport. As a fix, run git config --global protocol.file.allow always
    - name: Fix Git
      run: |
        git config --global protocol.file.allow always

    - name: Build flatpak
      run: |
        set -e
        flatpak-builder --default-branch=${FLATPAK_BRANCH} --arch=${{ matrix.alt }} --disable-updates --disable-download --ccache --sandbox --repo=${FLATPAK_BUILD_REPO}-${{ matrix.arch }} ${FLATPAK_BUILD_DIR} ${MANIFEST_PATH}

    - name: Upload OSTree Repository Artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-repo-${{ matrix.arch }}
        path: ${{ env.FLATPAK_BUILD_REPO }}-${{ matrix.arch }}

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Install Flatpak and OSTree
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak ostree

    - name: Download OSTree Repository Artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: build-repo-*

    # Add gpg secret key and passphrase to secrets.
    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@v7
      id: import-gpg
      with:
        gpg_private_key: ${{ secrets.GPG_KEY }}
        passphrase: ${{ secrets.GPG_PASSPHRASE }}

    - name: Merge repositories and update metadata
      run: |
        set -e
        GPG_PUB_B64=$(gpg --export ${{ steps.import-gpg.outputs.keyid }} | base64 -w0)
        mkdir -p build-repo-amd64/refs/{remotes,mirrors}
        mkdir -p build-repo-arm64/refs/{remotes,mirrors}
        ostree init --mode=archive --repo=combined-repo
        mkdir -p combined-repo/refs/{remotes,mirrors}
        flatpak build-commit-from --gpg-sign=${{ steps.import-gpg.outputs.keyid }} --src-repo=build-repo-amd64 combined-repo
        flatpak build-commit-from --gpg-sign=${{ steps.import-gpg.outputs.keyid }} --src-repo=build-repo-arm64 combined-repo
        flatpak build-update-repo --gpg-sign=${{ steps.import-gpg.outputs.keyid }} combined-repo

        cat <<EOF > combined-repo/quantumlauncher.flatpakrepo
        [Flatpak Repo]
        Title=Quantum Launcher
        Url=https://mrmayman.github.io/ql-flatpak-remote/
        Homepage=https://github.com/Mrmayman/ql-flatpak-remote
        Comment=QuantumLauncher Flatpak Repository
        GPGKey=${GPG_PUB_B64}
        DefaultBranch=stable
        EOF
        sed -i 's/^[ \t]*//' combined-repo/quantumlauncher.flatpakrepo

    - name: Deploy to GitHub Pages
      run: |
        set -e
        git clone -b gh-pages https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages
        rm -rf gh-pages/*
        cp -r combined-repo/* gh-pages/
        cd gh-pages
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add .
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Deploy flatpak repository for ${GITHUB_SHA:0:7}"
          git push
        fi